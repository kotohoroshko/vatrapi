name: vatrapi

services:
  app:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: vatrapi-app
    container_name: vatrapi-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ..:/var/www/html
    environment:
      APP_ENV: ${APP_ENV:-local}
    networks:
      - vatrapi

  nginx:
    image: nginx:1.27-alpine
    container_name: vatrapi-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ..:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - vatrapi

networks:
  vatrapi:
    driver: bridge
